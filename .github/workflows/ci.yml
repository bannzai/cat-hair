name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# ランナーは ubuntu-24.04 に固定する。撮影・録画の job は apt のパッケージ名と、Mesa llvmpipe が出す WARNING の文言
# (Makefile の WINDOWED_LOG_NOISE) に依存するため、イメージを上げる時は別の PR で確かめる
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: gdlint
        run: make lint
      - name: Test CI scripts
        run: |
          bash scripts/ci/test/test-check-human-verification.sh
          bash scripts/ci/test/test-list-uncommitted-generated.sh

  check-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: >-
            templates/linux_release.x86_64 templates/linux_debug.x86_64
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe
            templates/windows_release_x86_64_console.exe templates/windows_debug_x86_64_console.exe
            templates/macos.zip templates/web_nothreads_release.zip
      - name: Import assets and boot check
        run: make check GODOT="${{ steps.godot.outputs.godot }}"
      - name: Selfcheck
        run: make selfcheck GODOT="${{ steps.godot.outputs.godot }}"
      - name: Integration
        run: make integration GODOT="${{ steps.godot.outputs.godot }}"
      - name: Failure path of the check base
        run: make failure-path GODOT="${{ steps.godot.outputs.godot }}"
      - name: Export desktop builds
        run: make build-all GODOT="${{ steps.godot.outputs.godot }}"
      # Web 版は配布しないが、.github/workflows/browser-session.yml (workflow_dispatch だけで動く) が同じ書き出しを使うため、
      # Web のプリセットと make build-web が壊れたことを PR の時点で検出する
      - name: Export web build
        run: make build-web GODOT="${{ steps.godot.outputs.godot }}"
      # upload-artifact はファイルの実行権限を保持しないため、Linux のバイナリと PCK は権限を保持する tar にまとめる
      # (macOS は export 自体が zip、Windows は実行権限を使わない)
      - name: Package Linux build
        run: tar -czf build/cat-hair-linux.tar.gz -C build linux
      # import が生成した .uid / .import が commit されていなければ失敗させ、artifact に上げる (開発マシンでは Godot を
      # 起動しないため、ここで取り出して commit する。手順は AGENTS.md「検証方法」)。
      # 検証とエクスポートの結果を隠さないよう最後に置く
      - name: Check untracked generated files (.uid / .import)
        id: generated
        if: always()
        run: |
          untracked=$(bash scripts/ci/list-uncommitted-generated.sh)
          if [ -z "$untracked" ]; then
            echo "未 commit の .uid / .import はありません"
            exit 0
          fi
          mkdir -p tmp/generated
          printf '%s\n' "$untracked" | while IFS= read -r file; do
            if [ -f "$file" ]; then
              cp --parents "$file" tmp/generated/
            fi
          done
          printf '%s\n' "$untracked"
          echo "::error::未 commit の .uid / .import が $(printf '%s\n' "$untracked" | wc -l) 件あります。artifact cat-hair-generated を取り出して commit してください (AGENTS.md「検証方法」)"
          exit 1
      - name: Upload untracked generated files
        if: always() && steps.generated.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cat-hair-generated
          path: tmp/generated/
          if-no-files-found: error
          retention-days: 7
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cat-hair-check-logs
          path: tmp/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cat-hair-desktop
          path: |
            build/windows/
            build/macos/
            build/cat-hair-linux.tar.gz
          retention-days: 7

  # 描画付きの検証。headless の check / selfcheck / integration では見た目の崩れを検出できないため、
  # Xvfb + Mesa lavapipe (ソフトウェア Vulkan) 上で Forward+ による代表画面の撮影・起動の録画・毛ベンチマークを行い
  # artifact に残す。PR を開いた agent は artifact をダウンロードして PNG と mp4 を目視してから完了報告する (AGENTS.md「検証方法」)
  screenshot-and-movie:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          # エディタバイナリで動かすため export templates は要らない (tpz を取得しない)
          templates: ""
      - name: Start Xvfb with software Vulkan (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1-mesa-dri \
            libvulkan1 mesa-vulkan-drivers \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxkbcommon0
          nohup Xvfb :99 -screen 0 1280x720x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 30); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 1
          done
          [ -S /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          lvp_icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1 || true)
          [ -n "$lvp_icd" ] || { echo "::error::lavapipe ICD JSON が見つかりません"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lvp_icd" >> "$GITHUB_ENV"
      # ffmpeg が要るため、ffmpeg を入れたこの job で回す
      - name: Test the movie brightness check
        run: bash scripts/ci/test/test-check-movie-brightness.sh
      - name: Screenshot
        run: make screenshot GODOT="${{ steps.godot.outputs.godot }}"
      - name: Movie
        run: make movie GODOT="${{ steps.godot.outputs.godot }}"
      - name: Hair benchmark
        run: make hairbench GODOT="${{ steps.godot.outputs.godot }}"
      - name: Upload screenshots and movie
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cat-hair-screenshot-and-movie
          path: |
            tmp/screenshot-*.png
            tmp/hairbench-*.png
            tmp/hairbench.json
            tmp/movie.mp4
            tmp/*.log
          if-no-files-found: warn
          retention-days: 7
