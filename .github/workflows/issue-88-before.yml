name: 変更前の操作と保存の再現
on:
  push:
    branches: [issue-88]
    paths: [.github/workflows/issue-88-before.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: ''
      - name: 旧版で両方の検証を実行
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          make -k selfcheck integration || status=$?
          cat tmp/selfcheck.log tmp/integration.log
          awk '/^ERROR: .* FAIL:/ { print "::error::" $0 }' tmp/selfcheck.log tmp/integration.log
          exit "${status:-0}"
